name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"

      - name: Atualizar pip
        shell: powershell
        run: |
          python -m pip install --upgrade pip

      - name: Instalar dependencias
        shell: powershell
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-build.txt

      - name: Instalar Tesseract no computador temporario
        shell: powershell
        run: |
          choco install tesseract -y --no-progress

      - name: Localizar Tesseract
        shell: powershell
        run: |
          $candidates = @(
            "C:\Program Files\Tesseract-OCR",
            "C:\Program Files (x86)\Tesseract-OCR",
            "C:\tools\tesseract"
          )

          $src = $null

          foreach ($candidate in $candidates) {
            if (Test-Path (Join-Path $candidate "tesseract.exe")) {
              $src = $candidate
              break
            }
          }

          if (-not $src) {
            $cmd = Get-Command tesseract.exe -ErrorAction SilentlyContinue

            if ($cmd) {
              $src = Split-Path $cmd.Source -Parent
            }
          }

          if (-not $src) {
            throw "Tesseract nao foi localizado."
          }

          New-Item -ItemType Directory -Force -Path "vendor\tesseract" | Out-Null

          Copy-Item `
            -Path (Join-Path $src "*") `
            -Destination "vendor\tesseract" `
            -Recurse `
            -Force

      - name: Validar codigo Python
        shell: powershell
        run: |
          python -m compileall -q app.py launcher.py modules

      - name: Gerar EXE unico
        shell: powershell
        run: |
          python -m PyInstaller --noconfirm --clean SAP_Fotos_onefile.spec

      - name: Gerar versao portatil
        shell: powershell
        run: |
          python -m PyInstaller --noconfirm --clean SAP_Fotos_portable.spec

          Copy-Item `
            -Path "vendor\tesseract" `
            -Destination "dist\SAP_Fotos_Portatil\tesseract" `
            -Recurse `
            -Force

          Compress-Archive `
            -Path "dist\SAP_Fotos_Portatil\*" `
            -DestinationPath "dist\SAP_Fotos_Portatil.zip" `
            -Force

      - name: Verificar arquivos gerados
        shell: powershell
        run: |
          Get-ChildItem dist -Recurse

          if (-not (Test-Path "dist\SAP_Fotos.exe")) {
            throw "SAP_Fotos.exe nao foi gerado."
          }

          if (-not (Test-Path "dist\SAP_Fotos_Portatil.zip")) {
            throw "SAP_Fotos_Portatil.zip nao foi gerado."
          }

      - name: Gerar SHA256
        shell: powershell
        run: |
          $hash1 = (Get-FileHash "dist\SAP_Fotos.exe" -Algorithm SHA256).Hash
          $hash2 = (Get-FileHash "dist\SAP_Fotos_Portatil.zip" -Algorithm SHA256).Hash

          @(
            "SAP_Fotos.exe  $hash1",
            "SAP_Fotos_Portatil.zip  $hash2"
          ) | Set-Content "dist\SHA256.txt"

      - name: Disponibilizar arquivos
        uses: actions/upload-artifact@v4
        with:
          name: SAP-Fotos-Windows
          path: |
            dist/SAP_Fotos.exe
            dist/SAP_Fotos_Portatil.zip
            dist/SHA256.txt
          retention-days: 30
