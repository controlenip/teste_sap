name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - "app.py"
      - "launcher.py"
      - "modules/**"
      - "requirements*.txt"
      - "SAP_Fotos_*.spec"
      - "BASE_LEVANTAMENTO_ATUALIZADA.xlsx"
      - ".github/workflows/build-windows-exe.yml"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"
          cache: "pip"

      - name: Install Python dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Install Tesseract only on build runner
        shell: powershell
        run: |
          choco install tesseract -y --no-progress

          $candidates = @(
            "C:\Program Files\Tesseract-OCR",
            "C:\Program Files (x86)\Tesseract-OCR",
            "C:\tools\tesseract"
          )
          $src = $null
          foreach ($candidate in $candidates) {
            if (Test-Path (Join-Path $candidate "tesseract.exe")) {
              $src = $candidate
              break
            }
          }
          if (-not $src) {
            $cmd = Get-Command tesseract.exe -ErrorAction SilentlyContinue
            if ($cmd) { $src = Split-Path $cmd.Source -Parent }
          }
          if (-not $src) { throw "Tesseract nao foi localizado no runner." }

          New-Item -ItemType Directory -Force -Path "vendor\tesseract" | Out-Null
          Copy-Item -Path (Join-Path $src "*") -Destination "vendor\tesseract" -Recurse -Force
          if (-not (Test-Path "vendor\tesseract\tesseract.exe")) {
            throw "Falha ao preparar Tesseract portatil."
          }
          Write-Host "Tesseract copiado de $src"

      - name: Validate Python source and bot loader
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          if (-not (Test-Path "modules\sap_bot.py")) {
            throw "Falta modules/sap_bot.py"
          }

          python -m compileall -q app.py launcher.py modules
          if ($LASTEXITCODE -ne 0) {
            throw "Falha na validacao de sintaxe Python."
          }

          python -c "from modules.sap_bot import SAPPhotoBot; print('SAPPhotoBot SOURCE IMPORT OK:', SAPPhotoBot)"
          if ($LASTEXITCODE -ne 0) {
            throw "O arquivo modules/sap_bot.py nao expoe SAPPhotoBot."
          }

          python -c "import importlib.util,sys,modules; p=r'modules\sap_bot.py'; n='modules._sap_bot_embedded_test'; s=importlib.util.spec_from_file_location(n,p); m=importlib.util.module_from_spec(s); sys.modules[n]=m; s.loader.exec_module(m); assert hasattr(m,'SAPPhotoBot'); print('SAPPhotoBot DIRECT FILE LOAD OK:', m.SAPPhotoBot)"
          if ($LASTEXITCODE -ne 0) {
            throw "Falha ao carregar SAPPhotoBot diretamente do arquivo."
          }

          python -c "from modules.word_report import build_word_report; print('WORD IMPORT OK')"
          if ($LASTEXITCODE -ne 0) {
            throw "Falha no word_report."
          }
