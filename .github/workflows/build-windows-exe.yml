name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - "app.py"
      - "launcher.py"
      - "modules/**"
      - "requirements*.txt"
      - "SAP_Fotos_*.spec"
      - "BASE_LEVANTAMENTO_ATUALIZADA.xlsx"
      - ".github/workflows/build-windows-exe.yml"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"
          cache: "pip"

      - name: Install Python dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Install Tesseract only on build runner
        shell: powershell
        run: |
          choco install tesseract -y --no-progress

          $candidates = @(
            "C:\Program Files\Tesseract-OCR",
            "C:\Program Files (x86)\Tesseract-OCR",
            "C:\tools\tesseract"
          )
          $src = $null
          foreach ($candidate in $candidates) {
            if (Test-Path (Join-Path $candidate "tesseract.exe")) {
              $src = $candidate
              break
            }
          }
          if (-not $src) {
            $cmd = Get-Command tesseract.exe -ErrorAction SilentlyContinue
            if ($cmd) { $src = Split-Path $cmd.Source -Parent }
          }
          if (-not $src) { throw "Tesseract nao foi localizado no runner." }

          New-Item -ItemType Directory -Force -Path "vendor\tesseract" | Out-Null
          Copy-Item -Path (Join-Path $src "*") -Destination "vendor\tesseract" -Recurse -Force
          if (-not (Test-Path "vendor\tesseract\tesseract.exe")) {
            throw "Falha ao preparar Tesseract portatil."
          }
          Write-Host "Tesseract copiado de $src"

      - name: Validate Python source
        shell: powershell
        run: |
          python -m compileall -q app.py launcher.py modules

      - name: Build single EXE
        shell: powershell
        run: |
          python -m PyInstaller --noconfirm --clean SAP_Fotos_onefile.spec
          if (-not (Test-Path "dist\SAP_Fotos.exe")) { throw "SAP_Fotos.exe nao foi gerado." }

      - name: Build portable folder
        shell: powershell
        run: |
          python -m PyInstaller --noconfirm --clean SAP_Fotos_portable.spec
          if (-not (Test-Path "dist\SAP_Fotos_Portatil\SAP_Fotos_Portatil.exe")) { throw "Versao portatil nao foi gerada." }
          Copy-Item -Path "vendor\tesseract" -Destination "dist\SAP_Fotos_Portatil\tesseract" -Recurse -Force
          Compress-Archive -Path "dist\SAP_Fotos_Portatil\*" -DestinationPath "dist\SAP_Fotos_Portatil.zip" -Force -CompressionLevel Optimal

      - name: Generate SHA256
        shell: powershell
        run: |
          $hash1 = (Get-FileHash "dist\SAP_Fotos.exe" -Algorithm SHA256).Hash
          $hash2 = (Get-FileHash "dist\SAP_Fotos_Portatil.zip" -Algorithm SHA256).Hash
          @(
            "SAP_Fotos.exe  $hash1",
            "SAP_Fotos_Portatil.zip  $hash2"
          ) | Set-Content "dist\SHA256.txt"
          Get-Content "dist\SHA256.txt"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SAP-Fotos-Windows
          path: |
            dist/SAP_Fotos.exe
            dist/SAP_Fotos_Portatil.zip
            dist/SHA256.txt
          if-no-files-found: error
          retention-days: 30
